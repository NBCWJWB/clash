proxy-groups:
  - name: "自动选择"
    type: url-test
    proxies:
      {{proxy_names}}
    url: "http://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 50

  - name: "故障转移"
    type: fallback
    proxies:
      {{proxy_names}}
    url: "http://www.gstatic.com/generate_204"
    interval: 180

  - name: "香港自动"
