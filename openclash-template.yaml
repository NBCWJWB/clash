# OpenClash 配置模板
# 说明：
# 1. 这是按你原始 Clash 规则逻辑转换的 YAML版本
# 2. 你需要把实际节点订阅接入到 OpenClash，或者补充 proxy-providers / proxies
# 3. 此模板保留你原来的规则分组名称，便于直接替换

mixed-port: 7890
socks-port: 7891
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
secret: ""

# 你可以保留这段，稍后在 OpenClash 中替换成你的真实订阅
# proxy-providers:
#   mysub:
#     type: http
#     url: "https://example.com/subscription-url"
#     interval: 3600
#     path: ./proxy_providers/mysub.yaml
#     health-check:
#       enable: true
#       interval: 300
#       url: "http://www.gstatic.com/generate_204"

proxy-groups:
  - name: "所有-手动"
    type: select
    proxies:
      - DIRECT

  - name: "所有-自动"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 50
    proxies:
      - "香港-自动"
      - "台湾-自动"
      - "日本-自动"
      - "新加坡-自动"
      - "韩国-自动"
      - "美国-自动"
      - "其他-自动"

